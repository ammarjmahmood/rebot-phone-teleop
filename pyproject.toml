[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebot-teleop"
version = "0.1.0"
description = "iPhone, HEBI Mobile I/O and Meta Quest teleoperation for the Seeed reBot Arm B601 RS"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ammar Mahmood"}]
requires-python = ">=3.10,<3.13"
dependencies = [
    "motorbridge==0.5.6",
    "pin==3.9.0",
    "cmeel-urdfdom==4.0.1",
    "cmeel-tinyxml2==10.0.0",
    "numpy==2.3.5",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "websockets==17.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "psutil==7.2.2",
    "segno==1.6.6",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]

[project.scripts]
rebot-teleop = "rebot_teleop.__main__:main"

[tool.setuptools]
packages = ["rebot_teleop"]

[tool.setuptools.package-data]
rebot_teleop = ["static/*"]
