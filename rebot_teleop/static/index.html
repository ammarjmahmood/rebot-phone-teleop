<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>reBot teleop</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header><h1>reBot teleop</h1><span id="connection">Connecting</span><button class="stop" id="stop">STOP</button></header>
<main>
<div class="notice" id="fault" hidden></div>
<div id="arms"></div>
<section class="card local">
<h2>Phone and headset access</h2>
<label class="check"><input type="checkbox" id="remote"> Allow phone and headset motion for 15 minutes</label>
<button id="pair">Show pairing code</button>
<div id="pairing"></div>
<p class="fine" id="gist"></p>
</section>
<section class="card local">
<h2>HEBI Mobile I/O</h2>
<p class="fine">Hold Move (B1) to move. A3 sets the gripper while moving, B2 opens, B3 closes, B8 homes. Calibrate once by moving the phone about 10 cm up, forward and left while holding Move.</p>
<p id="hebi-status">Off</p>
<label>Arm for HEBI <select id="hebi-arm"></select></label>
<div class="row"><button class="primary" id="hebi-start">Start HEBI</button><button id="hebi-stop">Stop HEBI</button></div>
<div class="row"><button data-cal="up">Calibrate up</button><button data-cal="forward">Calibrate forward</button><button data-cal="left">Calibrate left</button></div>
<label>Phone Tailscale address, only when away from this WiFi <input id="hebi-address" placeholder="100.x.y.z"></label><button id="hebi-address-save">Save address</button>
</section>

</main>
<div id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
